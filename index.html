<style>

  .bigbtn.green { background: #e6f9e6; color: #1a7a1a; }
  .bigbtn.correct { background: #4caf50 !important; color: #fff !important; }
  .bigbtn.wrong { background: #f44336 !important; color: #fff !important; }
  .bigbtn:disabled { opacity: .85; cursor: default; }
  .question { font-size: 30px; font-weight: bold; text-align: center; margin: 12px 0 20px; line-height: 1.5; }
  .progress { display: flex; justify-content: space-between; font-size: 18px; color: #666; margin-bottom: 8px; }
  .bar { height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; margin-bottom: 16px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #7fb5f0, #4caf50); border-radius: 5px; transition: width .3s; }
  .feedback { text-align: center; font-size: 22px; min-height: 40px; margin: 8px 0; font-weight: bold; }
  .feedback.good { color: #2e9e2e; }
  .feedback.bad { color: #d33; }
  @keyframes praise { 0% { transform: scale(.5); opacity: 0; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .praise-anim { display: inline-block; animation: praise .5s ease; font-size: 40px; }
  .stars { font-size: 54px; text-align: center; margin: 10px 0; }
  .score-big { font-size: 34px; text-align: center; font-weight: bold; margin: 8px 0; }
  .mistake-item { background: #fff8f0; border: 1px solid #ffd9a0; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .mistake-item .mq { font-size: 22px; font-weight: bold; }
  .mistake-item .ma { font-size: 18px; color: #2e9e2e; margin-top: 4px; }
  .mistake-item .mw { font-size: 18px; color: #d33; margin-top: 2px; }
  .mistake-item button { min-height: 48px; font-size: 19px; margin-top: 8px; padding: 8px 20px; border-radius: 10px; border: none; background: #ff9f2e; color: #fff; cursor: pointer; }
  .group-title { font-size: 22px; font-weight: bold; margin: 18px 0 10px; color: #1a5cb0; }
  .slot { width:52px; height:62px; border:3px dashed #9ec7f0; border-radius:12px; font-size:32px; font-weight:bold; display:flex; align-items:center; justify-content:center; color:#1a5cb0; background:#f7fbff; cursor:pointer; }
  .slot-wrong { border-color:#f44336; color:#f44336; animation:shake .4s; }
  .tile { min-width:56px; min-height:56px; padding:10px 14px; font-size:28px; font-weight:bold; border:none; border-radius:14px; background:#fff3d6; color:#b07800; box-shadow:0 2px 6px rgba(0,0,0,.1); cursor:pointer; }
  .tile:disabled { opacity:.25; }
  .tile:active { transform:scale(.93); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .hidden { display: none; }
  .encourage { text-align: center; font-size: 20px; color: #666; margin: 10px 0; }
</style>

const SUBJECTS = {
  yuwen:  { name:'语文', icon:'📖', types:{ pinyin:'看拼音选汉字', zuci:'词语组词' } },
  shuxue: { name:'数学', icon:'🔢', types:{ kousuan:'100以内加减口算', chengfa:'乘法口诀' } },
  yingyu: { name:'英语', icon:'🔤', types:{ zh2en:'看中文选英文', en2zh:'看英文选中文', spell:'单词拼写 ✏️' } }
};
const PRAISE = ['太棒了！✨','答对啦！🎉','你真聪明！🌟','非常好！👍','完美！💯'];
const LS_KEY = 'grade2_mistakes';

let cur = { subject:null, type:null, questions:[], idx:0, score:0, redoMode:false };

function getMistakes(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch(e){ return []; } }
function saveMistakes(m){ localStorage.setItem(LS_KEY, JSON.stringify(m)); updateMCount(); }
function updateMCount(){ const n = getMistakes().length; document.getElementById('mcount').textContent = n ? '('+n+')' : ''; }

function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function show(id){ ['view-home','view-quiz','view-result','view-mistakes'].forEach(v=>document.getElementById(v).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- 首页：题型选择 ----------
function renderHome(subject){
  const s = SUBJECTS[subject];
  const types = Object.keys(s.types);
  let html = `<div class="card"><div class="question" style="font-size:26px">${s.icon} ${s.name} · 选择题型</div>`;
  types.forEach(t=>{
    const n = QB[subject][t].length;
    html += `<button class="bigbtn" onclick="startQuiz('${subject}','${t}')">${s.types[t]}<div style="font-size:16px;color:#888">题库 ${n} 道 · 每轮 10 题</div></button>`;
  });
  html += `</div>`;
  document.getElementById('view-home').innerHTML = html;
  show('view-home');
}

// ---------- 开始答题 ----------
function startQuiz(subject, type){
  const bank = QB[subject][type];
  if(!bank || !bank.length){ alert('题库还没有题目'); return; }
  const picked = shuffle(bank).slice(0, Math.min(10, bank.length));
  cur = { subject, type,
          questions: type==='spell' ? picked.map(q=>({hint:q.hint, word:q.word})) : picked.map(q=>prepQuestion(q)),
          idx:0, score:0, redoMode:false };
  if(type==='spell'){ renderSpell(); } else { renderQuestion(); show('view-quiz'); }
}
function prepQuestion(q){
  const correctText = q.options[q.answer];
  const order = shuffle(q.options.map((t,i)=>i));
  const opts = order.map(i=>q.options[i]);
  return { q:q.q, options:opts, correct:opts.indexOf(correctText) };
}

function renderQuestion(){
  const qq = cur.questions[cur.idx];
  const total = cur.questions.length;
  let html = `<div class="card">
    <div class="progress"><span>第 ${cur.idx+1}/${total} 题</span><span>得分 ${cur.score}</span></div>
    <div class="bar"><div style="width:${(cur.idx/total)*100}%"></div></div>
    <div class="question">${esc(qq.q)}</div>
    <div id="opts">`;
  qq.options.forEach((t,i)=>{ html += `<button class="bigbtn" id="opt${i}" onclick="answer(${i})">${esc(t)}</button>`; });
  html += `</div><div class="feedback" id="fb"></div></div>`;
  document.getElementById('view-quiz').innerHTML = html;
  show('view-quiz');
}

function answer(i){
  const qq = cur.questions[cur.idx];
  const fb = document.getElementById('fb');
  qq.options.forEach((_,j)=>{ document.getElementById('opt'+j).disabled = true; });
  if(i === qq.correct){
    document.getElementById('opt'+i).classList.add('correct');
    cur.score++;
    fb.className = 'feedback good';
    fb.innerHTML = `<span class="praise-anim">✨</span> ${PRAISE[Math.floor(Math.random()*PRAISE.length)]}`;
    setTimeout(nextQ, 1100);
  } else {
    document.getElementById('opt'+i).classList.add('wrong');
    document.getElementById('opt'+qq.correct).classList.add('correct');
    fb.className = 'feedback bad';
    fb.textContent = '正确答案是：' + qq.options[qq.correct];
    addMistake(qq, qq.options[i]);
    setTimeout(nextQ, 2200);
  }
  // 更新进度条与得分
  const total = cur.questions.length;
  document.querySelector('.bar > div').style.width = ((cur.idx+1)/total*100)+'%';
  document.querySelector('.progress span:last-child').textContent = '得分 '+cur.score;
}

function addMistake(qq, wrongText){
  const m = getMistakes();
  m.push({ subject:cur.subject, type:cur.type, q:qq.q, options:qq.options, answer:qq.correct, wrongText });
  saveMistakes(m);
}

function nextQ(){
  cur.idx++;
  if(cur.idx < cur.questions.length){ if(cur.type==='spell'){ renderSpell(); } else { renderQuestion(); } }
  else { renderResult(); }
}

// ---------- 单词拼写 ----------
function renderSpell(){
  const w = cur.questions[cur.idx];
  const total = cur.questions.length;
  const letters = shuffle(w.word.split(''));
  const head = cur.redoMode
    ? `<div class="question" style="font-size:24px">📝 错题重做 · 拼出这个单词</div>`
    : `<div class="progress"><span>第 ${cur.idx+1}/${total} 题</span><span>得分 ${cur.score}</span></div>
       <div class="bar"><div style="width:${(cur.idx/total)*100}%"></div></div>`;
  let html = `<div class="card">${head}
    <div class="question">${esc(w.hint)}</div>
    <div style="text-align:center;margin-bottom:6px"><button class="bigbtn" style="width:auto;display:inline-block;padding:10px 30px" onclick="speakWord('${w.word}')">🔊 听一听</button></div>
    <div id="slots" style="display:flex;justify-content:center;gap:8px;margin:14px 0;flex-wrap:wrap"></div>
    <div id="tiles" style="display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap"></div>
    <div class="feedback" id="fb"></div>
    <div style="text-align:center">
      <button class="bigbtn" style="width:auto;display:inline-block;padding:10px 30px" onclick="renderSpell()">↩️ 重拼</button>
      ${cur.redoMode ? `<button class="bigbtn" style="width:auto;display:inline-block;padding:10px 30px" onclick="renderMistakes()">返回错题本</button>` : ''}
    </div></div>`;
  document.getElementById('view-quiz').innerHTML = html;
  const slotsEl = document.getElementById('slots');
  w.word.split('').forEach((_,i)=>{
    const s = document.createElement('div');
    s.className = 'slot'; s.id = 'slot'+i;
    slotsEl.appendChild(s);
  });
  const tilesEl = document.getElementById('tiles');
  letters.forEach((ch,i)=>{
    const b = document.createElement('button');
    b.className = 'tile'; b.id = 'tile'+i; b.textContent = ch;
    b.onclick = ()=>pickLetter(i);
    tilesEl.appendChild(b);
  });
  show('view-quiz');
}

function speakWord(word){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.7;
    speechSynthesis.speak(u);
  }catch(e){}
}

function pickLetter(i){
  const w = cur.questions[cur.idx];
  const tile = document.getElementById('tile'+i);
  if(!tile || tile.disabled) return;
  for(let s=0;s<w.word.length;s++){
    const slot = document.getElementById('slot'+s);
    if(!slot.textContent){
      slot.textContent = tile.textContent;
      slot.dataset.tile = i;
      slot.onclick = ()=>returnLetter(s);
      tile.disabled = true;
      break;
    }
  }
  checkSpellDone();
}

function returnLetter(s){
  const slot = document.getElementById('slot'+s);
  if(!slot || !slot.textContent) return;
  const tile = document.getElementById('tile'+slot.dataset.tile);
  if(tile) tile.disabled = false;
  slot.textContent = '';
  slot.onclick = null;
}

function checkSpellDone(){
  const w = cur.questions[cur.idx];
  let attempt = '';
  for(let s=0;s<w.word.length;s++){ attempt += document.getElementById('slot'+s).textContent || ''; }
  if(attempt.length === w.word.length) gradeSpell(attempt);
}

function gradeSpell(attempt){
  const w = cur.questions[cur.idx];
  const fb = document.getElementById('fb');
  document.querySelectorAll('.tile').forEach(t=>{ t.disabled = true; });
  document.querySelectorAll('.slot').forEach(s=>{ s.onclick = null; });
  const ok = attempt === w.word;
  if(ok){
    cur.score++;
    fb.className = 'feedback good';
    fb.innerHTML = `<span class="praise-anim">✨</span> 拼写正确！${PRAISE[Math.floor(Math.random()*PRAISE.length)]}`;
    speakWord(w.word);
  } else {
    for(let s=0;s<w.word.length;s++){
      const slot = document.getElementById('slot'+s);
      if(slot.textContent !== w.word[s]) slot.classList.add('slot-wrong');
    }
    fb.className = 'feedback bad';
    fb.innerHTML = '正确拼写是：<b>' + esc(w.word) + '</b>';
    if(!cur.redoMode) addSpellMistake(w, attempt);
  }
  if(!cur.redoMode){
    const total = cur.questions.length;
    document.querySelector('.bar > div').style.width = ((cur.idx+1)/total*100)+'%';
    document.querySelector('.progress span:last-child').textContent = '得分 '+cur.score;
  }
  setTimeout(()=>{ ok ? spellCorrectNext() : spellWrongNext(); }, ok ? 1500 : 2800);
}

function spellCorrectNext(){
  if(cur.redoMode){
    const m = getMistakes(); m.splice(cur.redoIdx,1); saveMistakes(m);
    renderMistakes();
  } else {
    nextQ();
  }
}

function spellWrongNext(){
  if(cur.redoMode){ renderMistakes(); } else { nextQ(); }
}

function addSpellMistake(w, attempt){
  const m = getMistakes();
  m.push({ subject:'yingyu', type:'spell', q:w.hint, word:w.word, wrongText:attempt });
  saveMistakes(m);
}

// ---------- 结束页 ----------
function renderResult(){
  const total = cur.questions.length, s = cur.score;
  let stars, msg;
  if(s >= 9){ stars='⭐⭐⭐'; msg='太厉害了，你是小状元！🎓'; }
  else if(s >= 7){ stars='⭐⭐'; msg='很不错，继续保持！💪'; }
  else { stars='⭐'; msg='继续加油，你一定可以的！🌱'; }
  document.getElementById('view-result').innerHTML = `<div class="card">
    <div class="stars">${stars}</div>
    <div class="score-big">得分：${s} / ${total}</div>
    <div class="encourage">${msg}</div>
    <button class="bigbtn primary" onclick="startQuiz('${cur.subject}','${cur.type}')">再来一轮 🔄</button>
    <button class="bigbtn" onclick="renderHome('${cur.subject}')">返回题型选择</button>
  </div>`;
  show('view-result');
}

// ---------- 错题本 ----------
function renderMistakes(){
  const m = getMistakes();
  let html = '';
  if(!m.length){
    html = `<div class="card"><div class="encourage" style="font-size:24px">错题本空空如也，继续保持！🎈</div></div>`;
  } else {
    const groups = {};
    m.forEach((it,idx)=>{ (groups[it.subject] = groups[it.subject]||[]).push({it,idx}); });
    Object.keys(groups).forEach(sub=>{
      html += `<div class="group-title">${SUBJECTS[sub].icon} ${SUBJECTS[sub].name}（${groups[sub].length} 道）</div>`;
      groups[sub].forEach(({it,idx})=>{
        const isSpell = it.type==='spell';
        html += `<div class="mistake-item">
          <div class="mq">${esc(it.q)}${isSpell?' ✏️拼写':''}</div>
          <div class="ma">✅ ${isSpell?'正确拼写':'正确答案'}：${esc(isSpell?it.word:it.options[it.answer])}</div>
          <div class="mw">❌ ${isSpell?'当时拼成':'当时选了'}：${esc(it.wrongText)}</div>
          <button onclick="redoMistake(${idx})">重做这道题 ✏️</button>
        </div>`;
      });
    });
  }
  document.getElementById('view-mistakes').innerHTML = html;
  show('view-mistakes');
}

function redoMistake(idx){
  const m = getMistakes();
  const it = m[idx];
  if(!it) return;
  if(it.type==='spell'){
    cur = { subject:'yingyu', type:'spell',
            questions:[{ hint:it.q, word:it.word }],
            idx:0, score:0, redoMode:true, redoIdx:idx };
    renderSpell();
    return;
  }
  const order = shuffle(it.options.map((t,i)=>i));
  const opts = order.map(i=>it.options[i]);
  cur = { subject:it.subject, type:it.type,
          questions:[{ q:it.q, options:opts, correct:opts.indexOf(it.options[it.answer]) }],
          idx:0, score:0, redoMode:true, redoIdx:idx };
  renderRedo();
}

function renderRedo(){
  const qq = cur.questions[0];
  let html = `<div class="card">
    <div class="question" style="font-size:24px">📝 错题重做</div>
    <div class="question">${esc(qq.q)}</div><div id="opts">`;
  qq.options.forEach((t,i)=>{ html += `<button class="bigbtn" id="opt${i}" onclick="answerRedo(${i})">${esc(t)}</button>`; });
  html += `</div><div class="feedback" id="fb"></div>
    <button class="bigbtn" onclick="renderMistakes()">返回错题本</button></div>`;
  document.getElementById('view-quiz').innerHTML = html;
  show('view-quiz');
}

function answerRedo(i){
  const qq = cur.questions[0];
  const fb = document.getElementById('fb');
  qq.options.forEach((_,j)=>{ document.getElementById('opt'+j).disabled = true; });
  if(i === qq.correct){
    document.getElementById('opt'+i).classList.add('correct');
    fb.className = 'feedback good';
    fb.innerHTML = `<span class="praise-anim">🎉</span> 已掌握，移出错题本！`;
    const m = getMistakes(); m.splice(cur.redoIdx,1); saveMistakes(m);
    setTimeout(renderMistakes, 1500);
  } else {
    document.getElementById('opt'+i).classList.add('wrong');
    document.getElementById('opt'+qq.correct).classList.add('correct');
    fb.className = 'feedback bad';
    fb.textContent = '正确答案是：' + qq.options[qq.correct] + '，继续留在错题本加油！';
  }
}

// ---------- Tab 切换 ----------
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const s = t.dataset.s;
    if(s === 'mistakes'){ renderMistakes(); } else { renderHome(s); }
  });
});

updateMCount();
renderHome('yuwen');
</script>
</body>
</html>
