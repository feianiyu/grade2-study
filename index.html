<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>二年级学习小帮手 🌈</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #FFF8EC; color: #5A3E2B; }
  .header { display: flex; align-items: center; gap: 10px; background: #FFF8EC; color: #5A3E2B; padding: 10px 14px; border-bottom: 2px solid #FFE3B3; }
  .topbar-name { font-size: 20px; font-weight: 800; }
  .ff-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #FFD97D; background: #fff; flex: none; }
  .ff-badge { margin-left: auto; font-size: 13px; font-weight: 700; color: #fff; background: #FF9F43; border-radius: 999px; padding: 4px 12px; }
  .hero { text-align: center; }
  .hero-title { font-size: 28px; font-weight: 900; color: #5A3E2B; margin: 10px 0 4px; }
  .ff-hero { width: 160px; height: 160px; display: block; margin: 4px auto 0; }
  .ff-hero-sm { width: 96px; height: 96px; display: block; margin: 0 auto; }
  .bubble { position: relative; display: inline-block; background: #fff; border: 2.5px solid #FFD97D; border-radius: 18px; padding: 10px 18px; font-size: 18px; font-weight: 700; color: #5A3E2B; margin: 12px auto 2px; }
  .bubble::after { content: ''; position: absolute; left: 50%; top: -8px; transform: translateX(-50%); border: 8px solid transparent; border-bottom-color: #FFD97D; border-top: 0; }
  .howto { font-size: 17px; color: #8a6a4a; margin: 10px 0 16px; line-height: 1.7; }
  .ff-copyright { text-align: center; font-size: 14px; color: #B89A78; margin-top: 14px; }
  .cheer { text-align: center; font-size: 19px; font-weight: 800; color: #FF9F43; margin: 4px 0 12px; }
  #ff-overlay { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%); z-index: 99; pointer-events: none; }
  .ff-toast { display: flex; align-items: center; gap: 12px; background: #fff; border: 3px solid #FFD97D; border-radius: 18px; padding: 10px 18px 10px 10px; box-shadow: 0 8px 24px rgba(90,62,43,.20); animation: ffPop .25s ease; }
  .ff-toast img { width: 56px; height: 56px; }
  .ff-msg { font-size: 19px; font-weight: 800; color: #5A3E2B; white-space: nowrap; }
  @keyframes ffPop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .tabs { display: flex; background: #FFF8EC; box-shadow: 0 2px 6px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 10; }
  .tab { flex: 1; text-align: center; padding: 14px 4px; font-size: 19px; cursor: pointer; border-bottom: 4px solid transparent; color: #8a6a4a; }
  .tab.active { color: #fff; border-bottom-color: #FF9F43; font-weight: bold; background: #FF9F43; }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .bigbtn { display: block; width: 100%; min-height: 64px; margin: 10px 0; padding: 14px 16px; font-size: 24px; border: none; border-radius: 16px; background: #FFE9CF; color: #B36A00; cursor: pointer; transition: transform .1s; }
  .bigbtn:active { transform: scale(.97); }
  .bigbtn.primary { background: #FF9F43; color: #fff; font-weight: bold; }
  .bigbtn.green { background: #E6F6EC; color: #3E8E63; }
  .bigbtn.correct { background: #7FCBA4 !important; color: #fff !important; }
  .bigbtn.wrong { background: #FF8A80 !important; color: #fff !important; }
  .bigbtn:disabled { opacity: .85; cursor: default; }
  .question { font-size: 30px; font-weight: bold; text-align: center; margin: 12px 0 20px; line-height: 1.5; }
  .progress { display: flex; justify-content: space-between; font-size: 18px; color: #8a6a4a; margin-bottom: 8px; }
  .bar { height: 10px; background: #F6E3C8; border-radius: 5px; overflow: hidden; margin-bottom: 16px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #FFD97D, #FF9F43); border-radius: 5px; transition: width .3s; }
  .feedback { text-align: center; font-size: 22px; min-height: 40px; margin: 8px 0; font-weight: bold; }
  .feedback.good { color: #3E8E63; }
  .feedback.bad { color: #E0705F; }
  @keyframes praise { 0% { transform: scale(.5); opacity: 0; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .praise-anim { display: inline-block; animation: praise .5s ease; font-size: 40px; }
  .stars { font-size: 54px; text-align: center; margin: 10px 0; }
  .score-big { font-size: 34px; text-align: center; font-weight: bold; margin: 8px 0; }
  .mistake-item { background: #FFF8EC; border: 2px solid #FFD97D; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .mistake-item .mq { font-size: 22px; font-weight: bold; }
  .mistake-item .ma { font-size: 18px; color: #3E8E63; margin-top: 4px; }
  .mistake-item .mw { font-size: 18px; color: #E0705F; margin-top: 2px; }
  .mistake-item button { min-height: 48px; font-size: 19px; margin-top: 8px; padding: 8px 20px; border-radius: 10px; border: none; background: #FF9F43; color: #fff; cursor: pointer; }
  .group-title { font-size: 22px; font-weight: bold; margin: 18px 0 10px; color: #C26A00; }
  .slot { width:52px; height:62px; border:3px dashed #FFD97D; border-radius:12px; font-size:32px; font-weight:bold; display:flex; align-items:center; justify-content:center; color:#B36A00; background:#FFFBF2; cursor:pointer; }
  .slot-wrong { border-color:#FF8A80; color:#E0705F; animation:shake .4s; }
  .tile { min-width:56px; min-height:56px; padding:10px 14px; font-size:28px; font-weight:bold; border:none; border-radius:14px; background:#FFD97D; color:#5A3E2B; box-shadow:0 2px 6px rgba(0,0,0,.1); cursor:pointer; }
  .tile:disabled { opacity:.25; }
  .tile:active { transform:scale(.93); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .hidden { display: none; }
  .encourage { text-align: center; font-size: 20px; color: #8a6a4a; margin: 10px 0; }

body{background:radial-gradient(900px 420px at 50% -80px,#FFE9C0 0%,rgba(255,233,192,0) 65%),radial-gradient(700px 380px at 6% 32%,#FFE9F1 0%,rgba(255,233,241,0) 60%),radial-gradient(700px 380px at 94% 58%,#E2F2FF 0%,rgba(226,242,255,0) 60%),linear-gradient(180deg,#FFFBF1 0%,#FFF6E4 55%,#FFEED6 100%);overflow-x:hidden;}
.header,.tabs,.container{position:relative;z-index:1;}
.header{position:sticky;top:0;z-index:30;background:rgba(255,251,241,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.topbar-name{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:23px;letter-spacing:1px;}
.ff-avatar{width:38px;height:38px;border:2.5px solid #FFD97D;box-shadow:0 3px 8px rgba(217,123,31,.20);}
.ff-badge{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:linear-gradient(180deg,#FFB84D,#FF9F43);box-shadow:0 3px 0 #E07B1F;}
.ff-hero{animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(217,123,31,.20));}
.ff-hero-sm{animation:bob 3.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
.bubble{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:20px;border-radius:20px;box-shadow:0 6px 14px rgba(217,123,31,.10);}
.hero-title{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:34px;letter-spacing:3px;text-shadow:0 2px 0 #FFE3B3;}
.card{background:rgba(255,255,255,.94);border:3px solid #FFE9C9;border-radius:28px;box-shadow:0 14px 30px rgba(217,123,31,.10),inset 0 2px 0 #fff;}
.tab{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:20px;border:2.5px solid #FFE3B3;border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 4px 0 #F0D6AC;transition:transform .07s,box-shadow .07s;}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #F0D6AC;}
.tab.active{background:linear-gradient(180deg,#FFB84D,#FF9F43);border-color:#F59A2E;box-shadow:0 4px 0 #E07B1F;color:#fff;}
.bigbtn{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:25px;letter-spacing:2px;border:3px solid #FFE3B3;border-radius:20px;background:#fff;box-shadow:0 5px 0 #F0D6AC;transition:transform .07s,box-shadow .07s;}
.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #F0D6AC;}
.bigbtn.primary{background:linear-gradient(180deg,#FFB84D 0%,#FF9F43 100%);border-color:#F59A2E;color:#fff;box-shadow:0 6px 0 #E07B1F,0 12px 22px rgba(255,159,67,.35);font-size:28px;min-height:76px;text-shadow:0 2px 0 rgba(180,90,10,.25);}
.bigbtn.primary:active{transform:translateY(5px);box-shadow:0 1px 0 #E07B1F;}
.bigbtn.correct{background:linear-gradient(180deg,#8FD8AE,#7FCBA4)!important;border-color:#5DAE82!important;color:#fff!important;box-shadow:0 5px 0 #5DAE82!important;}
.bigbtn.wrong{background:linear-gradient(180deg,#FFA49A,#FF8A80)!important;border-color:#E56A5C!important;color:#fff!important;box-shadow:0 5px 0 #E56A5C!important;}
.bigbtn.green{background:linear-gradient(180deg,#8FD8AE,#7FCBA4);border:3px solid #5DAE82;color:#fff;box-shadow:0 5px 0 #5DAE82;}
.question{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;letter-spacing:2px;text-shadow:0 2px 0 #FFE9C9;}
.score-big{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;letter-spacing:2px;}
.group-title{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;letter-spacing:1px;}
.mistake-item{background:#FFFCF5;border:2.5px solid #FFE3B3;border-radius:20px;box-shadow:0 6px 14px rgba(217,123,31,.08);}
.mistake-item .mq{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;letter-spacing:1px;}
.mistake-item button{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;border:3px solid #F59A2E;border-radius:16px;background:linear-gradient(180deg,#FFB84D,#FF9F43);box-shadow:0 4px 0 #E07B1F;}
.mistake-item button:active{transform:translateY(3px);box-shadow:0 1px 0 #E07B1F;}
.tile{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;border:3px solid #FFE3B3;border-radius:16px;background:#fff;box-shadow:0 4px 0 #F0D6AC;}
.tile:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 #F0D6AC;}
.slot{border:3px dashed #FFD97D;border-radius:14px;font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#FFFCF5;}
.ff-msg{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:20px;}
.cheer{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:21px;color:#E07B1F;}
.stars{filter:drop-shadow(0 4px 6px rgba(255,180,60,.4));}

.decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.cloud{position:absolute;background:#FFFDF7;border-radius:999px;opacity:.95;box-shadow:0 8px 20px rgba(255,170,80,.20),inset 0 -7px 12px #FFE9C4;animation:drift linear infinite;}
.cloud::before,.cloud::after{content:'';position:absolute;background:#FFFDF7;border-radius:50%;box-shadow:inset 0 -5px 8px #FFE9C4;}
.c1{width:120px;height:38px;top:9%;animation-duration:85s;}
.c1::before{width:52px;height:52px;top:-24px;left:18px;}.c1::after{width:36px;height:36px;top:-15px;left:64px;}
.c2{width:84px;height:28px;top:22%;animation-duration:60s;animation-delay:-30s;opacity:.85;}
.c2::before{width:38px;height:38px;top:-18px;left:12px;}.c2::after{width:26px;height:26px;top:-11px;left:44px;}
.c3{width:150px;height:44px;top:4%;animation-duration:110s;animation-delay:-60s;opacity:.75;}
.c3::before{width:64px;height:64px;top:-30px;left:24px;}.c3::after{width:44px;height:44px;top:-19px;left:80px;}
@keyframes drift{from{transform:translateX(-170px);}to{transform:translateX(112vw);}}
.spark{position:absolute;color:#FFC93C;font-size:20px;animation:twinkle 2.8s ease-in-out infinite;text-shadow:0 0 8px #FFE9A8;}
.s1{top:20%;left:10%;}.s2{top:12%;right:14%;animation-delay:.9s;font-size:15px;}.s3{top:36%;left:5%;animation-delay:1.7s;font-size:16px;}.s4{top:30%;right:7%;animation-delay:2.2s;}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0deg);}50%{opacity:1;transform:scale(1.15) rotate(20deg);}}
.hill{position:absolute;left:-25%;right:-25%;bottom:-150px;height:270px;background:radial-gradient(ellipse 60% 100% at 50% 100%,#FFE2B8 0%,#FFD9A0 55%,rgba(255,217,160,0) 72%);}
.confetti{position:fixed;top:-16px;width:10px;height:15px;z-index:200;border-radius:3px;pointer-events:none;animation:cfall 2.3s ease-in forwards;}
@keyframes cfall{to{transform:translateY(108vh) rotate(720deg);opacity:.85;}}
.ff-badge{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#FFB84D,#FF9F43);border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 #E07B1F;}

</style>

const SUBJECTS = {
  yuwen:  { name:'语文', icon:'📖', types:{ pinyin:'看拼音选汉字', zuci:'词语组词' } },
  shuxue: { name:'数学', icon:'🔢', types:{ kousuan:'100以内加减口算', chengfa:'乘法口诀' } },
  yingyu: { name:'英语', icon:'🔤', types:{ zh2en:'看中文选英文', en2zh:'看英文选中文', spell:'单词拼写 ✏️' } }
};
// 方方话术库（规范第三章，方方第一人称口吻）
const PRAISE = ['太棒了！','答对啦，你真聪明！','方方给你点赞！','就是这样，保持住！'];
const COMFORT = ['没关系，再想想~','差一点点，方方陪你一起想~','错了也没关系，记住就是胜利！'];
const LS_KEY = 'grade2_mistakes';

let cur = { subject:null, type:null, questions:[], idx:0, score:0, redoMode:false };

function getMistakes(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch(e){ return []; } }
function saveMistakes(m){ localStorage.setItem(LS_KEY, JSON.stringify(m)); updateMCount(); }
function updateMCount(){ const n = getMistakes().length; document.getElementById('mcount').textContent = n ? '('+n+')' : ''; }

function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function show(id){ ['view-start','view-home','view-quiz','view-result','view-mistakes'].forEach(v=>document.getElementById(v).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }


// ---------- 方方反馈浮层（小浮层/气泡 1.2 秒，不打断做题节奏） ----------
function ffToast(img, msg){
  let wrap = document.getElementById('ff-overlay');
  if(!wrap){ wrap = document.createElement('div'); wrap.id = 'ff-overlay'; document.body.appendChild(wrap); }
  wrap.innerHTML = '<div class="ff-toast"><img src="'+img+'" alt="方方"><div class="ff-msg">'+esc(msg)+'</div></div>';
  clearTimeout(ffToast._t);
  ffToast._t = setTimeout(()=>{ wrap.innerHTML=''; }, 1200);
}
function ffGood(){ ffToast(FF_IMG.happy, PRAISE[Math.floor(Math.random()*PRAISE.length)]); }
function ffBad(){ ffToast(FF_IMG.comfort, COMFORT[Math.floor(Math.random()*COMFORT.length)]); }
function confetti(n){var colors=['#FF9F43','#FFD97D','#7FCBA4','#FF8A80','#8EC5FF','#FFB84D'];for(var i=0;i<n;i++){var s=document.createElement('i');s.className='confetti';s.style.left=(Math.random()*100)+'vw';s.style.background=colors[i%colors.length];s.style.animationDelay=(Math.random()*0.45)+'s';document.body.appendChild(s);(function(el){setTimeout(function(){el.remove();},2900);})(s);}}

// ---------- 开屏（规范第二章：固定开屏公式） ----------
function renderStart(){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('view-start').innerHTML =
    '<div class="card hero">'
    + '<img class="ff-hero" src="' + FF_IMG.hello + '" alt="方方">'
    + '<div class="bubble">你好呀！我是方方，今天想学点什么呢？😄</div>'
    + '<h1 class="hero-title">二年级学习小帮手</h1>'
    + '<div class="howto">语文数学英语随心选，每轮 10 题，答错自动进错题本！</div>'
    + '<button class="bigbtn primary" onclick="goHome(\'yuwen\')">🚀 开始学习</button>'
    + '<div class="ff-copyright">方方实验室 出品</div>'
    + '</div>';
  show('view-start');
}
function goHome(s){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.s === s));
  renderHome(s);
}

// ---------- 首页：题型选择 ----------
function renderHome(subject){
  const s = SUBJECTS[subject];
  const types = Object.keys(s.types);
  let html = `<div class="card"><div class="question" style="font-size:26px">${s.icon} ${s.name} · 选择题型</div>`;
  types.forEach(t=>{
    const n = QB[subject][t].length;
    html += `<button class="bigbtn" onclick="startQuiz('${subject}','${t}')">${s.types[t]}<div style="font-size:16px;color:#888">题库 ${n} 道 · 每轮 10 题</div></button>`;
  });
  html += `</div>`;
  document.getElementById('view-home').innerHTML = html;
  show('view-home');
}

// ---------- 开始答题 ----------
function startQuiz(subject, type){
  const bank = QB[subject][type];
  if(!bank || !bank.length){ alert('题库还没有题目'); return; }
  const picked = shuffle(bank).slice(0, Math.min(10, bank.length));
  cur = { subject, type,
          questions: type==='spell' ? picked.map(q=>({hint:q.hint, word:q.word})) : picked.map(q=>prepQuestion(q)),
          idx:0, score:0, redoMode:false };
  if(type==='spell'){ renderSpell(); } else { renderQuestion(); show('view-quiz'); }
}
function prepQuestion(q){
  const correctText = q.options[q.answer];
  const order = shuffle(q.options.map((t,i)=>i));
  const opts = order.map(i=>q.options[i]);
  return { q:q.q, options:opts, correct:opts.indexOf(correctText) };
}

function renderQuestion(){
  const qq = cur.questions[cur.idx];
  const total = cur.questions.length;
  let html = `<div class="card">
    <div class="progress"><span>第 ${cur.idx+1}/${total} 题</span><span>得分 ${cur.score}</span></div>
    <div class="bar"><div style="width:${(cur.idx/total)*100}%"></div></div>
    <div class="question">${esc(qq.q)}</div>
    <div id="opts">`;
  qq.options.forEach((t,i)=>{ html += `<button class="bigbtn" id="opt${i}" onclick="answer(${i})">${esc(t)}</button>`; });
  html += `</div><div class="feedback" id="fb"></div></div>`;
  document.getElementById('view-quiz').innerHTML = html;
  show('view-quiz');
}

function answer(i){
  const qq = cur.questions[cur.idx];
  const fb = document.getElementById('fb');
  qq.options.forEach((_,j)=>{ document.getElementById('opt'+j).disabled = true; });
  if(i === qq.correct){
    document.getElementById('opt'+i).classList.add('correct');
    cur.score++;
    ffGood();
    confetti(26);
    fb.className = 'feedback good';
    fb.innerHTML = `<span class="praise-anim">✨</span> ${PRAISE[Math.floor(Math.random()*PRAISE.length)]}`;
    setTimeout(nextQ, 1100);
  } else {
    document.getElementById('opt'+i).classList.add('wrong');
    document.getElementById('opt'+qq.correct).classList.add('correct');
    fb.className = 'feedback bad';
    ffBad();
    fb.textContent = '正确答案是：' + qq.options[qq.correct];
    addMistake(qq, qq.options[i]);
    setTimeout(nextQ, 2200);
  }
  // 更新进度条与得分
  const total = cur.questions.length;
  document.querySelector('.bar > div').style.width = ((cur.idx+1)/total*100)+'%';
  document.querySelector('.progress span:last-child').textContent = '得分 '+cur.score;
}

function addMistake(qq, wrongText){
  const m = getMistakes();
  m.push({ subject:cur.subject, type:cur.type, q:qq.q, options:qq.options, answer:qq.correct, wrongText });
  saveMistakes(m);
}

function nextQ(){
  cur.idx++;
  if(cur.idx < cur.questions.length){ if(cur.type==='spell'){ renderSpell(); } else { renderQuestion(); } }
  else { renderResult(); }
}

// ---------- 单词拼写 ----------
function renderSpell(){
  const w = cur.questions[cur.idx];
  const total = cur.questions.length;
  const letters = shuffle(w.word.split(''));
  const head = cur.redoMode
    ? `<div class="question" style="font-size:24px">📝 错题重做 · 拼出这个单词</div>`
    : `<div class="progress"><span>第 ${cur.idx+1}/${total} 题</span><span>得分 ${cur.score}</span></div>
       <div class="bar"><div style="width:${(cur.idx/total)*100}%"></div></div>`;
  let html = `<div class="card">${head}
    <div class="question">${esc(w.hint)}</div>
    <div style="text-align:center;margin-bottom:6px"><button class="bigbtn" style="width:auto;display:inline-block;padding:10px 30px" onclick="speakWord('${w.word}')">🔊 听一听</button></div>
    <div id="slots" style="display:flex;justify-content:center;gap:8px;margin:14px 0;flex-wrap:wrap"></div>
    <div id="tiles" style="display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap"></div>
    <div class="feedback" id="fb"></div>
    <div style="text-align:center">
      <button class="bigbtn" style="width:auto;display:inline-block;padding:10px 30px" onclick="renderSpell()">↩️ 重拼</button>
      ${cur.redoMode ? `<button class="bigbtn" style="width:auto;display:inline-block;padding:10px 30px" onclick="renderMistakes()">返回错题本</button>` : ''}
    </div></div>`;
  document.getElementById('view-quiz').innerHTML = html;
  const slotsEl = document.getElementById('slots');
  w.word.split('').forEach((_,i)=>{
    const s = document.createElement('div');
    s.className = 'slot'; s.id = 'slot'+i;
    slotsEl.appendChild(s);
  });
  const tilesEl = document.getElementById('tiles');
  letters.forEach((ch,i)=>{
    const b = document.createElement('button');
    b.className = 'tile'; b.id = 'tile'+i; b.textContent = ch;
    b.onclick = ()=>pickLetter(i);
    tilesEl.appendChild(b);
  });
  show('view-quiz');
}

function speakWord(word){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.7;
    speechSynthesis.speak(u);
  }catch(e){}
}

function pickLetter(i){
  const w = cur.questions[cur.idx];
  const tile = document.getElementById('tile'+i);
  if(!tile || tile.disabled) return;
  for(let s=0;s<w.word.length;s++){
    const slot = document.getElementById('slot'+s);
    if(!slot.textContent){
      slot.textContent = tile.textContent;
      slot.dataset.tile = i;
      slot.onclick = ()=>returnLetter(s);
      tile.disabled = true;
      break;
    }
  }
  checkSpellDone();
}

function returnLetter(s){
  const slot = document.getElementById('slot'+s);
  if(!slot || !slot.textContent) return;
  const tile = document.getElementById('tile'+slot.dataset.tile);
  if(tile) tile.disabled = false;
  slot.textContent = '';
  slot.onclick = null;
}

function checkSpellDone(){
  const w = cur.questions[cur.idx];
  let attempt = '';
  for(let s=0;s<w.word.length;s++){ attempt += document.getElementById('slot'+s).textContent || ''; }
  if(attempt.length === w.word.length) gradeSpell(attempt);
}

function gradeSpell(attempt){
  const w = cur.questions[cur.idx];
  const fb = document.getElementById('fb');
  document.querySelectorAll('.tile').forEach(t=>{ t.disabled = true; });
  document.querySelectorAll('.slot').forEach(s=>{ s.onclick = null; });
  const ok = attempt === w.word;
  if(ok){
    cur.score++;
    ffGood();
    confetti(26);
    fb.className = 'feedback good';
    fb.innerHTML = `<span class="praise-anim">✨</span> 拼写正确！${PRAISE[Math.floor(Math.random()*PRAISE.length)]}`;
    speakWord(w.word);
  } else {
    for(let s=0;s<w.word.length;s++){
      const slot = document.getElementById('slot'+s);
      if(slot.textContent !== w.word[s]) slot.classList.add('slot-wrong');
    }
    fb.className = 'feedback bad';
    ffBad();
    fb.innerHTML = '正确拼写是：<b>' + esc(w.word) + '</b>';
    if(!cur.redoMode) addSpellMistake(w, attempt);
  }
  if(!cur.redoMode){
    const total = cur.questions.length;
    document.querySelector('.bar > div').style.width = ((cur.idx+1)/total*100)+'%';
    document.querySelector('.progress span:last-child').textContent = '得分 '+cur.score;
  }
  setTimeout(()=>{ ok ? spellCorrectNext() : spellWrongNext(); }, ok ? 1500 : 2800);
}

function spellCorrectNext(){
  if(cur.redoMode){
    const m = getMistakes(); m.splice(cur.redoIdx,1); saveMistakes(m);
    renderMistakes();
  } else {
    nextQ();
  }
}

function spellWrongNext(){
  if(cur.redoMode){ renderMistakes(); } else { nextQ(); }
}

function addSpellMistake(w, attempt){
  const m = getMistakes();
  m.push({ subject:'yingyu', type:'spell', q:w.hint, word:w.word, wrongText:attempt });
  saveMistakes(m);
}

// ---------- 结束页 ----------
function renderResult(){
  const total = cur.questions.length, s = cur.score;
  let stars, msg;
  if(s >= 9){ stars='⭐⭐⭐'; msg='太厉害了，你是小状元！🎓'; }
  else if(s >= 7){ stars='⭐⭐'; msg='很不错，继续保持！💪'; }
  else { stars='⭐'; msg='继续加油，你一定可以的！🌱'; }
  if(s>=7)confetti(70);
  document.getElementById('view-result').innerHTML = `<div class="card" style="text-align:center">
    <img class="ff-hero-sm" src="${s >= 7 ? FF_IMG.happy : FF_IMG.comfort}" alt="方方">
    <div class="stars">${stars}</div>
    <div class="score-big">得分：${s} / ${total}</div>
    <div class="encourage">${msg}</div>
    <div class="cheer">${s >= 7 ? '方方为你欢呼！🎉' : '方方陪你继续加油！💪'}</div>
    <button class="bigbtn primary" onclick="startQuiz('${cur.subject}','${cur.type}')">再来一轮 🔄</button>
    <button class="bigbtn" onclick="renderHome('${cur.subject}')">返回题型选择</button>
  </div>`;
  show('view-result');
}

// ---------- 错题本 ----------
function renderMistakes(){
  const m = getMistakes();
  let html = '';
  if(!m.length){
    html = `<div class="card"><div class="encourage" style="font-size:24px">错题本空空如也，继续保持！🎈</div></div>`;
  } else {
    const groups = {};
    m.forEach((it,idx)=>{ (groups[it.subject] = groups[it.subject]||[]).push({it,idx}); });
    Object.keys(groups).forEach(sub=>{
      html += `<div class="group-title">${SUBJECTS[sub].icon} ${SUBJECTS[sub].name}（${groups[sub].length} 道）</div>`;
      groups[sub].forEach(({it,idx})=>{
        const isSpell = it.type==='spell';
        html += `<div class="mistake-item">
          <div class="mq">${esc(it.q)}${isSpell?' ✏️拼写':''}</div>
          <div class="ma">✅ ${isSpell?'正确拼写':'正确答案'}：${esc(isSpell?it.word:it.options[it.answer])}</div>
          <div class="mw">❌ ${isSpell?'当时拼成':'当时选了'}：${esc(it.wrongText)}</div>
          <button onclick="redoMistake(${idx})">重做这道题 ✏️</button>
        </div>`;
      });
    });
  }
  document.getElementById('view-mistakes').innerHTML = html;
  show('view-mistakes');
}

function redoMistake(idx){
  const m = getMistakes();
  const it = m[idx];
  if(!it) return;
  if(it.type==='spell'){
    cur = { subject:'yingyu', type:'spell',
            questions:[{ hint:it.q, word:it.word }],
            idx:0, score:0, redoMode:true, redoIdx:idx };
    renderSpell();
    return;
  }
  const order = shuffle(it.options.map((t,i)=>i));
  const opts = order.map(i=>it.options[i]);
  cur = { subject:it.subject, type:it.type,
          questions:[{ q:it.q, options:opts, correct:opts.indexOf(it.options[it.answer]) }],
          idx:0, score:0, redoMode:true, redoIdx:idx };
  renderRedo();
}

function renderRedo(){
  const qq = cur.questions[0];
  let html = `<div class="card">
    <div class="question" style="font-size:24px">📝 错题重做</div>
    <div class="question">${esc(qq.q)}</div><div id="opts">`;
  qq.options.forEach((t,i)=>{ html += `<button class="bigbtn" id="opt${i}" onclick="answerRedo(${i})">${esc(t)}</button>`; });
  html += `</div><div class="feedback" id="fb"></div>
    <button class="bigbtn" onclick="renderMistakes()">返回错题本</button></div>`;
  document.getElementById('view-quiz').innerHTML = html;
  show('view-quiz');
}

function answerRedo(i){
  const qq = cur.questions[0];
  const fb = document.getElementById('fb');
  qq.options.forEach((_,j)=>{ document.getElementById('opt'+j).disabled = true; });
  if(i === qq.correct){
    document.getElementById('opt'+i).classList.add('correct');
    ffGood();
    confetti(26);
    fb.className = 'feedback good';
    fb.innerHTML = `<span class="praise-anim">🎉</span> 已掌握，移出错题本！`;
    const m = getMistakes(); m.splice(cur.redoIdx,1); saveMistakes(m);
    setTimeout(renderMistakes, 1500);
  } else {
    document.getElementById('opt'+i).classList.add('wrong');
    document.getElementById('opt'+qq.correct).classList.add('correct');
    fb.className = 'feedback bad';
    ffBad();
    fb.textContent = '正确答案是：' + qq.options[qq.correct] + '，继续留在错题本加油！';
  }
}

// ---------- Tab 切换 ----------
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const s = t.dataset.s;
    if(s === 'mistakes'){ renderMistakes(); } else { renderHome(s); }
  });
});

updateMCount();
document.getElementById('ffTopAvatar').src = FF_IMG.hello;
renderStart();
</script>
</body>
</html>
