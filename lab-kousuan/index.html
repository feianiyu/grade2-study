// ========== 工具 ==========
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
const PRAISE = ['太棒了！✨','答对啦！🎉','你真聪明！🌟','非常好！👍','完美！💯','厉害厉害！🏆'];

// ========== 存档（localStorage） ==========
const LS = { level: 'kousuan_level', used: 'kousuan_used', mistakes: 'kousuan_mistakes' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function getLevel() { const n = parseInt(lsGet(LS.level, 1), 10); return (isNaN(n) || n < 1) ? 1 : n; }
function setLevel(n) { lsSet(LS.level, n); }
function getMistakes() { return lsGet(LS.mistakes, []); }
function saveMistakes(m) { lsSet(LS.mistakes, m); paintMCount(); }
function paintMCount() { $('mcount').textContent = '(' + getMistakes().length + ')'; }

// ========== 全局状态 ==========
const TIME_LIMIT = 30, PER_LEVEL = 10, PASS_LINE = 8;
const cur = { level: 1, questions: [], idx: 0, score: 0, locked: false, redo: false, redoIdx: -1 };
let rafId = null, deadline = 0, pendingTimer = null;
function schedule(fn, ms) { clearTimeout(pendingTimer); pendingTimer = setTimeout(fn, ms); }

// 提示音（WebAudio，零依赖）
let actx = null;
function tone(f, d, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(vol || 0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}
function soundGood() { tone(660, .1); setTimeout(() => tone(880, .15), 90); }
function soundBad() { tone(200, .22, 'sawtooth', .07); }

// ========== 界面切换 ==========
function showScreen(name) {
  ['screen-start','screen-quiz','screen-result'].forEach(id => $(id).classList.add('hidden'));
  $('screen-' + name).classList.remove('hidden');
}
function showTabGame() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'game'));
  $('view-game').classList.remove('hidden');
  $('view-mistakes').classList.add('hidden');
}
function renderMistakes() {
  const m = getMistakes();
  let html;
  if (!m.length) {
    html = '<div class="card"><div class="encourage" style="font-size:22px;padding:22px 0">📒 错题本空空如也，继续保持！🎈</div></div>';
  } else {
    html = '<div class="card"><div class="m-title">📒 错题本（' + m.length + ' 道）· 答对即可移出</div></div>';
    m.forEach((it, idx) => {
      html += '<div class="mistake-item">'
        + '<div class="mq">🧮 ' + esc(it.q) + '</div>'
        + '<div class="ma">✅ 正确答案：' + esc(it.options[it.answer]) + '</div>'
        + '<div class="mw">❌ 当时选了：' + esc(it.wrongText) + '</div>'
        + '<button class="redo-btn" onclick="redoMistake(' + idx + ')">✏️ 重做这道题</button>'
        + '</div>';
    });
  }
  $('mistake-list').innerHTML = html;
  $('mistake-list').classList.remove('hidden');
  $('redo-view').classList.add('hidden');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'mistakes'));
  $('view-game').classList.add('hidden');
  $('view-mistakes').classList.remove('hidden');
}

// ========== 开始屏 ==========
function renderStart() {
  clearTimeout(pendingTimer);
  stopTimer();
  cur.level = getLevel();
  let picker = '';
  for (let l = 1; l <= getLevel(); l++) {
    picker += '<button class="lvl-btn' + (l === cur.level ? ' sel' : '') + '" onclick="pickLevel(' + l + ')">' + l + '</button>';
  }
  $('screen-start').innerHTML =
    '<div class="card hero">'
    + '<div class="logo">🧪</div>'
    + '<h1>方方实验室 · 口算闯关</h1>'
    + '<div class="howto">每关 10 道口算题，限时 30 秒，答对 8 题就过关，<br>答得越多星星越多，冲击三星 ⭐！</div>'
    + '<div class="lvl-label">选择关卡（已解锁到第 ' + getLevel() + ' 关）</div>'
    + '<div class="lvl-row">' + picker + '</div>'
    + '<div class="lvl-note">题库共 150 题 · 优先抽取从没出过的题</div>'
    + '<button class="bigbtn primary" onclick="startLevel(cur.level)">🚀 开始闯关</button>'
    + '</div>';
  showScreen('start');
  showTabGame();
}
function pickLevel(l) { cur.level = l; renderStart(); }

// ========== 抽题 ==========
function prep(q) {
  const order = shuffle([0, 1, 2, 3]);
  return { q: q.q, options: order.map(i => q.options[i]), correct: order.indexOf(q.answer) };
}
function drawQuestions() {
  let used = lsGet(LS.used, []);
  const usedSet = new Set(used);
  let unused = QUESTION_BANK.map((_, i) => i).filter(i => !usedSet.has(i));
  if (unused.length < PER_LEVEL) { used = []; unused = QUESTION_BANK.map((_, i) => i); }
  const picked = shuffle(unused).slice(0, PER_LEVEL);
  lsSet(LS.used, used.concat(picked));
  return picked.map(i => prep(QUESTION_BANK[i]));
}
function startLevel(l) {
  clearTimeout(pendingTimer);
  cur.level = l;
  cur.questions = drawQuestions();
  cur.idx = 0; cur.score = 0; cur.redo = false;
  renderQuestion();
}

// ========== 答题 ==========
function renderQuestion() {
  const qq = cur.questions[cur.idx];
  cur.locked = false;
  let opts = '';
  qq.options.forEach((t, i) => { opts += '<button class="bigbtn opt" id="opt' + i + '" onclick="answer(' + i + ')">' + esc(t) + '</button>'; });
  $('screen-quiz').innerHTML =
    '<div class="card">'
    + '<div class="progress"><span>第 ' + (cur.idx + 1) + ' / ' + PER_LEVEL + ' 题</span><span>得分 ' + cur.score + '</span></div>'
    + '<div class="pbar"><div id="pfill" style="width:' + (cur.idx / PER_LEVEL * 100) + '%"></div></div>'
    + '<div class="timerow"><span>⏱️ 倒计时</span><span><b id="timeleft">' + TIME_LIMIT + '</b> 秒</span></div>'
    + '<div class="tbar"><div id="timefill" style="width:100%"></div></div>'
    + '<div class="question">' + esc(qq.q) + '</div>'
    + '<div id="opts">' + opts + '</div>'
    + '<div class="feedback" id="fb"></div>'
    + '<button class="bigbtn" style="min-height:48px;font-size:17px" onclick="quitToStart()">🏠 退出本关</button>'
    + '</div>';
  showScreen('quiz');
  startTimer();
}
function startTimer() {
  stopTimer();
  deadline = Date.now() + TIME_LIMIT * 1000;
  const step = () => {
    const left = Math.max(0, (deadline - Date.now()) / 1000);
    paintTimer(left);
    if (left <= 0) { onTimeout(); return; }
    rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}
function stopTimer() { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } }
function paintTimer(left) {
  const fill = $('timefill'), label = $('timeleft');
  if (!fill || !label) return;
  fill.style.width = (left / TIME_LIMIT * 100) + '%';
  fill.style.background = left <= 5 ? '#F44336' : left <= 10 ? '#FF9F43' : '#FFB84D';
  label.textContent = Math.ceil(left);
}
function lockButtons() { for (let j = 0; j < 4; j++) { const b = $('opt' + j); if (b) b.disabled = true; } }
function paintProgress() {
  const f = $('pfill');
  const s = document.querySelector('#screen-quiz .progress span:last-child');
  if (f) f.style.width = ((cur.idx + 1) / PER_LEVEL * 100) + '%';
  if (s) s.textContent = '得分 ' + cur.score;
}
function showFb(kind, html) { const fb = $('fb'); fb.className = 'feedback ' + kind; fb.innerHTML = html; }
function praise() { return '<span class="praise-anim">🎉</span> ' + PRAISE[Math.floor(Math.random() * PRAISE.length)]; }

function answer(i) {
  if (cur.locked) return;
  cur.locked = true; stopTimer(); lockButtons();
  const qq = cur.questions[cur.idx];
  if (i === qq.correct) {
    $('opt' + i).classList.add('correct');
    cur.score++; soundGood();
    showFb('good', praise());
    paintProgress();
    schedule(nextQ, 1000);
  } else {
    $('opt' + i).classList.add('wrong');
    $('opt' + qq.correct).classList.add('correct');
    soundBad();
    showFb('bad', '😢 答错啦，正确答案是 <b>' + esc(qq.options[qq.correct]) + '</b>');
    addMistake(qq, qq.options[i]);
    paintProgress();
    schedule(nextQ, 2100);
  }
}
function onTimeout() {
  if (cur.locked) return;
  cur.locked = true; lockButtons();
  const qq = cur.questions[cur.idx];
  $('opt' + qq.correct).classList.add('correct');
  soundBad();
  showFb('bad', '⏰ 时间到！正确答案是 <b>' + esc(qq.options[qq.correct]) + '</b>');
  addMistake(qq, '⏰ 超时');
  paintProgress();
  schedule(nextQ, 2100);
}
function nextQ() {
  cur.idx++;
  if (cur.idx >= cur.questions.length) { renderResult(); } else { renderQuestion(); }
}
function quitToStart() { renderStart(); }

// ========== 结算 ==========
function renderResult() {
  stopTimer();
  const s = cur.score, ok = s >= PASS_LINE;
  let stars, msg;
  if (ok) {
    stars = '⭐'.repeat(s - PASS_LINE + 1);
    msg = s === PER_LEVEL ? '十题全对！你是口算小达人！🏆' : '闯关成功，继续加油！💪';
    if (cur.level >= getLevel()) setLevel(cur.level + 1);
  } else {
    stars = '🌱';
    msg = '答对 ' + s + ' 题，还差 ' + (PASS_LINE - s) + ' 题，加油！';
  }
  const btn = ok
    ? '<button class="bigbtn primary" onclick="startLevel(cur.level + 1)">下一关 ▶</button>'
    : '<button class="bigbtn primary" onclick="startLevel(cur.level)">再试一次 🔄</button>';
  $('screen-result').innerHTML =
    '<div class="card" style="text-align:center">'
    + '<div class="stars">' + stars + '</div>'
    + '<div class="score-big">' + (ok ? '🎉 闯关成功！' : '💪 闯关失败') + '</div>'
    + '<div class="score-big" style="font-size:26px">答对 ' + s + ' / ' + PER_LEVEL + ' 题</div>'
    + '<div class="encourage">' + msg + '</div>'
    + btn
    + '<button class="bigbtn" onclick="renderStart()">🏠 返回首页</button>'
    + '</div>';
  showScreen('result');
}

// ========== 错题本 ==========
function addMistake(qq, wrongText) {
  const m = getMistakes();
  if (m.some(x => x.q === qq.q)) return;
  m.push({ q: qq.q, options: qq.options, answer: qq.correct, wrongText: String(wrongText) });
  saveMistakes(m);
}
function redoMistake(idx) {
  const it = getMistakes()[idx];
  if (!it) return;
  clearTimeout(pendingTimer);
  const order = shuffle([0, 1, 2, 3]);
  cur.redo = true; cur.redoIdx = idx;
  cur.questions = [{ q: it.q, options: order.map(i => it.options[i]), correct: order.indexOf(it.answer) }];
  cur.idx = 0; cur.score = 0; cur.locked = false;
  const qq = cur.questions[0];
  let opts = '';
  qq.options.forEach((t, i) => { opts += '<button class="bigbtn opt" id="opt' + i + '" onclick="answerRedo(' + i + ')">' + esc(t) + '</button>'; });
  $('redo-view').innerHTML =
    '<div class="card">'
    + '<div class="progress"><span>📝 错题重做</span><span>答对即移出错题本</span></div>'
    + '<div class="question">' + esc(qq.q) + '</div>'
    + '<div id="opts">' + opts + '</div>'
    + '<div class="feedback" id="fb"></div>'
    + '<button class="bigbtn" onclick="renderMistakes()">🏠 返回错题本</button>'
    + '</div>';
  $('mistake-list').classList.add('hidden');
  $('redo-view').classList.remove('hidden');
}
function answerRedo(i) {
  if (cur.locked) return;
  cur.locked = true; lockButtons();
  const qq = cur.questions[0];
  if (i === qq.correct) {
    $('opt' + i).classList.add('correct');
    soundGood();
    showFb('good', '<span class="praise-anim">🎉</span> 答对啦！已移出错题本！');
    const m = getMistakes();
    if (m[cur.redoIdx]) m.splice(cur.redoIdx, 1);
    saveMistakes(m);
    schedule(renderMistakes, 1400);
  } else {
    $('opt' + i).classList.add('wrong');
    $('opt' + qq.correct).classList.add('correct');
    soundBad();
    showFb('bad', '😢 正确答案是 <b>' + esc(qq.options[qq.correct]) + '</b>，继续加油！');
  }
}

// ========== 启动 ==========
paintMCount();
renderStart();
</script>
