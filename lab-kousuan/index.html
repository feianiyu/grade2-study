*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#5A3E2B;min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow-x:hidden;
background:radial-gradient(900px 420px at 50% -80px,#FFE9C0 0%,rgba(255,233,192,0) 65%),radial-gradient(700px 380px at 6% 32%,#FFE9F1 0%,rgba(255,233,241,0) 60%),radial-gradient(700px 380px at 94% 58%,#E2F2FF 0%,rgba(226,242,255,0) 60%),linear-gradient(180deg,#FFFBF1 0%,#FFF6E4 55%,#FFEED6 100%);}
/* ===== 场景装饰 ===== */
.decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.cloud{position:absolute;background:#FFFDF7;border-radius:999px;opacity:.95;box-shadow:0 8px 20px rgba(255,170,80,.20),inset 0 -7px 12px #FFE9C4;animation:drift linear infinite;}
.cloud::before,.cloud::after{content:'';position:absolute;background:#FFFDF7;border-radius:50%;box-shadow:inset 0 -5px 8px #FFE9C4;}
.c1{width:120px;height:38px;top:9%;animation-duration:85s;}
.c1::before{width:52px;height:52px;top:-24px;left:18px;}.c1::after{width:36px;height:36px;top:-15px;left:64px;}
.c2{width:84px;height:28px;top:22%;animation-duration:60s;animation-delay:-30s;opacity:.8;}
.c2::before{width:38px;height:38px;top:-18px;left:12px;}.c2::after{width:26px;height:26px;top:-11px;left:44px;}
.c3{width:150px;height:44px;top:4%;animation-duration:110s;animation-delay:-60s;opacity:.7;}
.c3::before{width:64px;height:64px;top:-30px;left:24px;}.c3::after{width:44px;height:44px;top:-19px;left:80px;}
@keyframes drift{from{transform:translateX(-170px);}to{transform:translateX(112vw);}}
.spark{position:absolute;color:#FFC93C;font-size:20px;animation:twinkle 2.8s ease-in-out infinite;text-shadow:0 0 8px #FFE9A8;}
.s1{top:20%;left:10%;}.s2{top:12%;right:14%;animation-delay:.9s;font-size:15px;}.s3{top:36%;left:5%;animation-delay:1.7s;font-size:16px;}.s4{top:30%;right:7%;animation-delay:2.2s;}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0deg);}50%{opacity:1;transform:scale(1.15) rotate(20deg);}}
.hill{position:absolute;left:-25%;right:-25%;bottom:-150px;height:270px;background:radial-gradient(ellipse 60% 100% at 50% 100%,#FFE2B8 0%,#FFD9A0 55%,rgba(255,217,160,0) 72%);}
.topbar,.tabs,.container{position:relative;z-index:1;}
/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,251,241,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid #FFE3B3;}
.topbar-name{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:23px;color:#5A3E2B;letter-spacing:1px;}
.ff-avatar{width:38px;height:38px;border-radius:50%;border:2.5px solid #FFD97D;background:#fff;flex:none;box-shadow:0 3px 8px rgba(217,123,31,.20);}
.ff-badge{margin-left:auto;font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#FFB84D,#FF9F43);border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 #E07B1F;}
/* ===== 开屏 ===== */
.hero{text-align:center;}
.ff-hero{width:150px;height:150px;display:block;margin:2px auto 0;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(217,123,31,.20));}
.ff-hero-sm{width:96px;height:96px;display:block;margin:0 auto;animation:bob 3.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
.bubble{position:relative;display:inline-block;background:#fff;border:2.5px solid #FFD97D;border-radius:20px;padding:10px 20px;font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:20px;letter-spacing:.5px;color:#5A3E2B;margin:14px auto 4px;box-shadow:0 6px 14px rgba(217,123,31,.10);}
.bubble::after{content:'';position:absolute;left:50%;top:-9px;transform:translateX(-50%);border:9px solid transparent;border-bottom-color:#FFD97D;border-top:0;}
.howto{font-size:17px;color:#9A7448;margin:10px 0 16px;line-height:1.75;}
.ff-copyright{text-align:center;font-size:14px;color:#C4A276;margin-top:14px;letter-spacing:2px;}
.cheer{text-align:center;font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:21px;color:#E07B1F;margin:4px 0 12px;letter-spacing:1px;}
#ff-overlay{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);z-index:99;pointer-events:none;}
.ff-toast{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #FFD97D;border-radius:20px;padding:10px 20px 10px 10px;box-shadow:0 10px 26px rgba(90,62,43,.22);animation:ffPop .25s ease;}
.ff-toast img{width:58px;height:58px;}
.ff-msg{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:20px;color:#5A3E2B;white-space:nowrap;letter-spacing:.5px;}
@keyframes ffPop{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
/* ===== Tabs ===== */
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:10px;max-width:640px;margin:14px auto 0;padding:4px 12px 12px;}
.tab{flex:1;text-align:center;padding:13px 4px;font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:20px;letter-spacing:1px;color:#B07A3E;background:rgba(255,255,255,.88);border:2.5px solid #FFE3B3;border-radius:18px;box-shadow:0 4px 0 #F0D6AC;cursor:pointer;appearance:none;-webkit-appearance:none;transition:transform .07s,box-shadow .07s;}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #F0D6AC;}
.tab.active{background:linear-gradient(180deg,#FFB84D,#FF9F43);border-color:#F59A2E;color:#fff;box-shadow:0 4px 0 #E07B1F;text-shadow:0 1px 0 rgba(180,90,10,.25);}
/* ===== 卡片与按钮 ===== */
.container{max-width:640px;margin:4px auto 60px;padding:0 14px;}
.card{background:rgba(255,255,255,.94);border:3px solid #FFE9C9;border-radius:28px;padding:24px 20px;margin-bottom:18px;box-shadow:0 14px 30px rgba(217,123,31,.10),inset 0 2px 0 #fff;}
.card.hero h1{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:35px;margin:10px 0 6px;color:#5A3E2B;letter-spacing:3px;text-shadow:0 2px 0 #FFE3B3;}
.lvl-label{font-size:17px;font-weight:700;color:#A4784F;margin-bottom:12px;}
.lvl-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:0 0 14px;}
.lvl-btn{width:56px;height:56px;border-radius:18px;border:3px solid #FFE3B3;font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:23px;background:#fff;color:#B36A00;cursor:pointer;box-shadow:0 4px 0 #F0D6AC;appearance:none;-webkit-appearance:none;transition:transform .07s,box-shadow .07s;}
.lvl-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #F0D6AC;}
.lvl-btn.sel{background:linear-gradient(180deg,#FFB84D,#FF9F43);color:#fff;border-color:#F59A2E;box-shadow:0 4px 0 #E07B1F;}
.lvl-note{font-size:15px;color:#C4A276;margin:2px 0 16px;}
.bigbtn{display:block;width:100%;min-height:64px;margin:12px 0;padding:14px 16px;font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:25px;letter-spacing:2px;border:3px solid #FFE3B3;border-radius:20px;background:#fff;color:#B36A00;cursor:pointer;box-shadow:0 5px 0 #F0D6AC;transition:transform .07s,box-shadow .07s;appearance:none;-webkit-appearance:none;-webkit-touch-callout:none;}
.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #F0D6AC;}
.bigbtn.primary{background:linear-gradient(180deg,#FFB84D 0%,#FF9F43 100%);color:#fff;border-color:#F59A2E;box-shadow:0 6px 0 #E07B1F,0 12px 22px rgba(255,159,67,.35);font-size:28px;min-height:78px;text-shadow:0 2px 0 rgba(180,90,10,.25);}
.bigbtn.primary:active{transform:translateY(5px);box-shadow:0 1px 0 #E07B1F,0 4px 10px rgba(255,159,67,.25);}
.bigbtn.correct{background:linear-gradient(180deg,#8FD8AE,#7FCBA4)!important;border-color:#5DAE82!important;color:#fff!important;box-shadow:0 5px 0 #5DAE82!important;text-shadow:0 1px 0 rgba(40,120,70,.25);}
.bigbtn.wrong{background:linear-gradient(180deg,#FFA49A,#FF8A80)!important;border-color:#E56A5C!important;color:#fff!important;box-shadow:0 5px 0 #E56A5C!important;text-shadow:0 1px 0 rgba(160,60,50,.25);}
.bigbtn:disabled{cursor:default;}
.bigbtn.opt{font-size:32px;}
.question{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:56px;text-align:center;margin:18px 0 24px;color:#4A3826;letter-spacing:3px;text-shadow:0 3px 0 #FFE9C9;}
.progress{display:flex;justify-content:space-between;font-size:17px;font-weight:700;color:#A4784F;margin-bottom:8px;}
.pbar{height:12px;background:#F6E3C8;border-radius:7px;overflow:hidden;margin-bottom:14px;box-shadow:inset 0 2px 4px rgba(180,120,50,.15);}
.pbar>div{height:100%;background:linear-gradient(90deg,#FFD97D,#FF9F43);border-radius:7px;transition:width .3s;}
.timerow{display:flex;justify-content:space-between;font-size:16px;font-weight:700;color:#A4784F;margin-bottom:8px;}
.tbar{height:14px;background:#F6E3C8;border-radius:8px;overflow:hidden;margin-bottom:6px;box-shadow:inset 0 2px 4px rgba(180,120,50,.15);}
.tbar>div{height:100%;background:#FFD97D;border-radius:8px;transition:width .2s;}
.feedback{text-align:center;font-size:22px;min-height:46px;margin:12px 0;font-weight:800;line-height:1.5;}
.feedback.good{color:#2F7D4F;}
.feedback.bad{color:#D95F4E;}
@keyframes praise{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.25);opacity:1;}100%{transform:scale(1);opacity:1;}}
.praise-anim{display:inline-block;animation:praise .5s ease;font-size:40px;}
.stars{font-size:58px;text-align:center;margin:10px 0;animation:praise .6s ease;letter-spacing:8px;filter:drop-shadow(0 4px 6px rgba(255,180,60,.4));}
.score-big{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:34px;text-align:center;margin:10px 0;color:#4A3826;letter-spacing:2px;}
.encourage{text-align:center;font-size:19px;color:#9A7448;margin:10px 0 18px;line-height:1.65;}
.m-title{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:22px;color:#B36A00;text-align:center;padding:6px 0;letter-spacing:1px;}
.mistake-item{background:#FFFCF5;border:2.5px solid #FFE3B3;border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:0 6px 14px rgba(217,123,31,.08);}
.mistake-item .mq{font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:27px;color:#4A3826;letter-spacing:1px;}
.mistake-item .ma{font-size:18px;color:#2F7D4F;margin-top:8px;font-weight:700;}
.mistake-item .mw{font-size:17px;color:#D95F4E;margin-top:4px;}
.redo-btn{min-height:54px;font-family:'FFont',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:20px;letter-spacing:1px;margin-top:12px;padding:10px 26px;border-radius:16px;border:3px solid #F59A2E;background:linear-gradient(180deg,#FFB84D,#FF9F43);color:#fff;cursor:pointer;box-shadow:0 4px 0 #E07B1F;appearance:none;-webkit-appearance:none;transition:transform .07s,box-shadow .07s;}
.redo-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #E07B1F;}
/* ===== 撒花 ===== */
.confetti{position:fixed;top:-16px;width:10px;height:15px;z-index:200;border-radius:3px;pointer-events:none;animation:cfall 2.3s ease-in forwards;}
@keyframes cfall{to{transform:translateY(108vh) rotate(720deg);opacity:.85;}}
.hidden{display:none;}
</style>
</head>

// ========== 工具 ==========
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
// 方方话术库（规范第三章，方方第一人称口吻）
const PRAISE = ['太棒了！','答对啦，你真聪明！','方方给你点赞！','就是这样，保持住！'];
const COMFORT = ['没关系，再想想~','差一点点，方方陪你一起想~','错了也没关系，记住就是胜利！'];

// ========== 存档（localStorage） ==========
const LS = { level: 'kousuan_level', used: 'kousuan_used', mistakes: 'kousuan_mistakes' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function getLevel() { const n = parseInt(lsGet(LS.level, 1), 10); return (isNaN(n) || n < 1) ? 1 : n; }
function setLevel(n) { lsSet(LS.level, n); }
function getMistakes() { return lsGet(LS.mistakes, []); }
function saveMistakes(m) { lsSet(LS.mistakes, m); paintMCount(); }
function paintMCount() { $('mcount').textContent = '(' + getMistakes().length + ')'; }

// ========== 全局状态 ==========
const TIME_LIMIT = 30, PER_LEVEL = 10, PASS_LINE = 8;
const cur = { level: 1, questions: [], idx: 0, score: 0, locked: false, redo: false, redoIdx: -1 };
let rafId = null, deadline = 0, pendingTimer = null;
function schedule(fn, ms) { clearTimeout(pendingTimer); pendingTimer = setTimeout(fn, ms); }

// 提示音（WebAudio，零依赖）
let actx = null;
function tone(f, d, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(vol || 0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}
function soundGood() { tone(660, .1); setTimeout(() => tone(880, .15), 90); }
function soundBad() { tone(200, .22, 'sawtooth', .07); }

// ========== 界面切换 ==========
function showScreen(name) {
  ['screen-start','screen-quiz','screen-result'].forEach(id => $(id).classList.add('hidden'));
  $('screen-' + name).classList.remove('hidden');
}
function showTabGame() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'game'));
  $('view-game').classList.remove('hidden');
  $('view-mistakes').classList.add('hidden');
}
function renderMistakes() {
  const m = getMistakes();
  let html;
  if (!m.length) {
    html = '<div class="card"><div class="encourage" style="font-size:22px;padding:22px 0">📒 错题本空空如也，继续保持！🎈</div></div>';
  } else {
    html = '<div class="card"><div class="m-title">📒 错题本（' + m.length + ' 道）· 答对即可移出</div></div>';
    m.forEach((it, idx) => {
      html += '<div class="mistake-item">'
        + '<div class="mq">🧮 ' + esc(it.q) + '</div>'
        + '<div class="ma">✅ 正确答案：' + esc(it.options[it.answer]) + '</div>'
        + '<div class="mw">❌ 当时选了：' + esc(it.wrongText) + '</div>'
        + '<button class="redo-btn" onclick="redoMistake(' + idx + ')">✏️ 重做这道题</button>'
        + '</div>';
    });
  }
  $('mistake-list').innerHTML = html;
  $('mistake-list').classList.remove('hidden');
  $('redo-view').classList.add('hidden');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'mistakes'));
  $('view-game').classList.add('hidden');
  $('view-mistakes').classList.remove('hidden');
}

// ========== 开始屏 ==========
function renderStart() {
  clearTimeout(pendingTimer);
  stopTimer();
  cur.level = getLevel();
  let picker = '';
  for (let l = 1; l <= getLevel(); l++) {
    picker += '<button class="lvl-btn' + (l === cur.level ? ' sel' : '') + '" onclick="pickLevel(' + l + ')">' + l + '</button>';
  }
  $('screen-start').innerHTML =
    '<div class="card hero">'
    + '<img class="ff-hero" src="' + FF_IMG.hello + '" alt="方方">'
    + '<div class="bubble">你好呀！我是方方，咱们一起去口算闯关吧！🧪</div>'
    + '<h1>方方实验室 · 口算闯关</h1>'
    + '<div class="howto">每关 10 道口算题，限时 30 秒，答对 8 题就过关，<br>答得越多星星越多，冲击三星 ⭐！</div>'
    + '<div class="lvl-label">选择关卡（已解锁到第 ' + getLevel() + ' 关）</div>'
    + '<div class="lvl-row">' + picker + '</div>'
    + '<div class="lvl-note">题库共 150 题 · 优先抽取从没出过的题</div>'
    + '<button class="bigbtn primary" onclick="startLevel(cur.level)">🚀 开始闯关</button>'
    + '<div class="ff-copyright">方方实验室 出品</div>'
    + '</div>';
  showScreen('start');
  showTabGame();
}
function pickLevel(l) { cur.level = l; renderStart(); }

// ========== 抽题 ==========
function prep(q) {
  const order = shuffle([0, 1, 2, 3]);
  return { q: q.q, options: order.map(i => q.options[i]), correct: order.indexOf(q.answer) };
}
function drawQuestions() {
  let used = lsGet(LS.used, []);
  const usedSet = new Set(used);
  let unused = QUESTION_BANK.map((_, i) => i).filter(i => !usedSet.has(i));
  if (unused.length < PER_LEVEL) { used = []; unused = QUESTION_BANK.map((_, i) => i); }
  const picked = shuffle(unused).slice(0, PER_LEVEL);
  lsSet(LS.used, used.concat(picked));
  return picked.map(i => prep(QUESTION_BANK[i]));
}
function startLevel(l) {
  clearTimeout(pendingTimer);
  cur.level = l;
  cur.questions = drawQuestions();
  cur.idx = 0; cur.score = 0; cur.redo = false;
  renderQuestion();
}

// ========== 答题 ==========
function renderQuestion() {
  const qq = cur.questions[cur.idx];
  cur.locked = false;
  let opts = '';
  qq.options.forEach((t, i) => { opts += '<button class="bigbtn opt" id="opt' + i + '" onclick="answer(' + i + ')">' + esc(t) + '</button>'; });
  $('screen-quiz').innerHTML =
    '<div class="card">'
    + '<div class="progress"><span>第 ' + (cur.idx + 1) + ' / ' + PER_LEVEL + ' 题</span><span>得分 ' + cur.score + '</span></div>'
    + '<div class="pbar"><div id="pfill" style="width:' + (cur.idx / PER_LEVEL * 100) + '%"></div></div>'
    + '<div class="timerow"><span>⏱️ 倒计时</span><span><b id="timeleft">' + TIME_LIMIT + '</b> 秒</span></div>'
    + '<div class="tbar"><div id="timefill" style="width:100%"></div></div>'
    + '<div class="question">' + esc(qq.q) + '</div>'
    + '<div id="opts">' + opts + '</div>'
    + '<div class="feedback" id="fb"></div>'
    + '<button class="bigbtn" style="min-height:48px;font-size:17px" onclick="quitToStart()">🏠 退出本关</button>'
    + '</div>';
  showScreen('quiz');
  startTimer();
}
function startTimer() {
  stopTimer();
  deadline = Date.now() + TIME_LIMIT * 1000;
  const step = () => {
    const left = Math.max(0, (deadline - Date.now()) / 1000);
    paintTimer(left);
    if (left <= 0) { onTimeout(); return; }
    rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}
function stopTimer() { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } }
function paintTimer(left) {
  const fill = $('timefill'), label = $('timeleft');
  if (!fill || !label) return;
  fill.style.width = (left / TIME_LIMIT * 100) + '%';
  fill.style.background = left <= 5 ? '#FF8A80' : left <= 10 ? '#FF9F43' : '#FFD97D';
  label.textContent = Math.ceil(left);
}
function lockButtons() { for (let j = 0; j < 4; j++) { const b = $('opt' + j); if (b) b.disabled = true; } }
function paintProgress() {
  const f = $('pfill');
  const s = document.querySelector('#screen-quiz .progress span:last-child');
  if (f) f.style.width = ((cur.idx + 1) / PER_LEVEL * 100) + '%';
  if (s) s.textContent = '得分 ' + cur.score;
}
function showFb(kind, html) { const fb = $('fb'); fb.className = 'feedback ' + kind; fb.innerHTML = html; }
function praise() { return '<span class="praise-anim">🎉</span> ' + PRAISE[Math.floor(Math.random() * PRAISE.length)]; }
// ===== 方方反馈浮层（小浮层/气泡 1.2 秒，不打断做题节奏） =====
function ffToast(img, msg) {
  let wrap = $('ff-overlay');
  if (!wrap) { wrap = document.createElement('div'); wrap.id = 'ff-overlay'; document.body.appendChild(wrap); }
  wrap.innerHTML = '<div class="ff-toast"><img src="' + img + '" alt="方方"><div class="ff-msg">' + esc(msg) + '</div></div>';
  clearTimeout(ffToast._t);
  ffToast._t = setTimeout(() => { wrap.innerHTML = ''; }, 1200);
}
function ffGood() { ffToast(FF_IMG.happy, PRAISE[Math.floor(Math.random() * PRAISE.length)]); }
function ffBad() { ffToast(FF_IMG.comfort, COMFORT[Math.floor(Math.random() * COMFORT.length)]); }
function confetti(n){var colors=['#FF9F43','#FFD97D','#7FCBA4','#FF8A80','#8EC5FF','#FFB84D'];for(var i=0;i<n;i++){var s=document.createElement('i');s.className='confetti';s.style.left=(Math.random()*100)+'vw';s.style.background=colors[i%colors.length];s.style.animationDelay=(Math.random()*0.45)+'s';document.body.appendChild(s);(function(el){setTimeout(function(){el.remove();},2900);})(s);}}


function answer(i) {
  if (cur.locked) return;
  cur.locked = true; stopTimer(); lockButtons();
  const qq = cur.questions[cur.idx];
  if (i === qq.correct) {
    $('opt' + i).classList.add('correct');
    cur.score++; soundGood(); ffGood(); confetti(26);
    showFb('good', praise());
    paintProgress();
    schedule(nextQ, 1000);
  } else {
    $('opt' + i).classList.add('wrong');
    $('opt' + qq.correct).classList.add('correct');
    soundBad(); ffBad();
    showFb('bad', '😢 答错啦，正确答案是 <b>' + esc(qq.options[qq.correct]) + '</b>');
    addMistake(qq, qq.options[i]);
    paintProgress();
    schedule(nextQ, 2100);
  }
}
function onTimeout() {
  if (cur.locked) return;
  cur.locked = true; lockButtons();
  const qq = cur.questions[cur.idx];
  $('opt' + qq.correct).classList.add('correct');
  soundBad(); ffBad();
  showFb('bad', '⏰ 时间到！正确答案是 <b>' + esc(qq.options[qq.correct]) + '</b>');
  addMistake(qq, '⏰ 超时');
  paintProgress();
  schedule(nextQ, 2100);
}
function nextQ() {
  cur.idx++;
  if (cur.idx >= cur.questions.length) { renderResult(); } else { renderQuestion(); }
}
function quitToStart() { renderStart(); }

// ========== 结算 ==========
function renderResult() {
  stopTimer();
  const s = cur.score, ok = s >= PASS_LINE;
  let stars, msg, cheer;
  if (ok) {
    stars = '⭐'.repeat(s - PASS_LINE + 1);
    msg = s === PER_LEVEL ? '十题全对！你是口算小达人！🏆' : '闯关成功，继续加油！💪';
    cheer = (s - PASS_LINE + 1) + ' 星闯关成功！方方为你欢呼！';
    confetti(70); if (cur.level >= getLevel()) setLevel(cur.level + 1);
  } else {
    stars = '🌱';
    msg = '答对 ' + s + ' 题，还差 ' + (PASS_LINE - s) + ' 题，加油！';
    cheer = '差一点点，方方陪你一起练~';
  }
  const btn = ok
    ? '<button class="bigbtn primary" onclick="startLevel(cur.level + 1)">下一关 ▶</button>'
    : '<button class="bigbtn primary" onclick="startLevel(cur.level)">再试一次 🔄</button>';
  $('screen-result').innerHTML =
    '<div class="card" style="text-align:center">'
    + '<img class="ff-hero-sm" src="' + (ok ? FF_IMG.happy : FF_IMG.comfort) + '" alt="方方">'
    + '<div class="stars">' + stars + '</div>'
    + '<div class="score-big">' + (ok ? '🎉 闯关成功！' : '💪 闯关失败') + '</div>'
    + '<div class="score-big" style="font-size:26px">答对 ' + s + ' / ' + PER_LEVEL + ' 题</div>'
    + '<div class="encourage">' + msg + '</div>'
    + '<div class="cheer">' + cheer + '</div>'
    + btn
    + '<button class="bigbtn" onclick="renderStart()">🏠 返回首页</button>'
    + '</div>';
  showScreen('result');
}

// ========== 错题本 ==========
function addMistake(qq, wrongText) {
  const m = getMistakes();
  if (m.some(x => x.q === qq.q)) return;
  m.push({ q: qq.q, options: qq.options, answer: qq.correct, wrongText: String(wrongText) });
  saveMistakes(m);
}
function redoMistake(idx) {
  const it = getMistakes()[idx];
  if (!it) return;
  clearTimeout(pendingTimer);
  const order = shuffle([0, 1, 2, 3]);
  cur.redo = true; cur.redoIdx = idx;
  cur.questions = [{ q: it.q, options: order.map(i => it.options[i]), correct: order.indexOf(it.answer) }];
  cur.idx = 0; cur.score = 0; cur.locked = false;
  const qq = cur.questions[0];
  let opts = '';
  qq.options.forEach((t, i) => { opts += '<button class="bigbtn opt" id="opt' + i + '" onclick="answerRedo(' + i + ')">' + esc(t) + '</button>'; });
  $('redo-view').innerHTML =
    '<div class="card">'
    + '<div class="progress"><span>📝 错题重做</span><span>答对即移出错题本</span></div>'
    + '<div class="question">' + esc(qq.q) + '</div>'
    + '<div id="opts">' + opts + '</div>'
    + '<div class="feedback" id="fb"></div>'
    + '<button class="bigbtn" onclick="renderMistakes()">🏠 返回错题本</button>'
    + '</div>';
  $('mistake-list').classList.add('hidden');
  $('redo-view').classList.remove('hidden');
}
function answerRedo(i) {
  if (cur.locked) return;
  cur.locked = true; lockButtons();
  const qq = cur.questions[0];
  if (i === qq.correct) {
    $('opt' + i).classList.add('correct');
    soundGood(); ffGood();
    showFb('good', '<span class="praise-anim">🎉</span> 答对啦！已移出错题本！');
    const m = getMistakes();
    if (m[cur.redoIdx]) m.splice(cur.redoIdx, 1);
    saveMistakes(m);
    schedule(renderMistakes, 1400);
  } else {
    $('opt' + i).classList.add('wrong');
    $('opt' + qq.correct).classList.add('correct');
    soundBad(); ffBad();
    showFb('bad', '😢 正确答案是 <b>' + esc(qq.options[qq.correct]) + '</b>，继续加油！');
  }
}

// ========== 启动 ==========
paintMCount();
document.getElementById('ffTopAvatar').src = FF_IMG.hello;
renderStart();
</script>
